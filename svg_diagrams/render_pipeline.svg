<line x1="1040" y1="110" x2="1120" y2="340" stroke="#6496DC" stroke-width="2"/>
<polygon points="1120,340 1112,336 1112,344" fill="#6496DC"/>
<text x="1080" y="219" class="arrlbl">composite</text>
<line x1="1040" y1="230" x2="1120" y2="340" stroke="#6496DC" stroke-width="2"/>
<polygon points="1120,340 1112,336 1112,344" fill="#6496DC"/>
<line x1="1040" y1="350" x2="1120" y2="340" stroke="#6496DC" stroke-width="2"/>
<polygon points="1120,340 1112,336 1112,344" fill="#6496DC"/>
<line x1="1040" y1="470" x2="1120" y2="340" stroke="#6496DC" stroke-width="2"/>
<polygon points="1120,340 1112,336 1112,344" fill="#6496DC"/>
