<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="900" viewBox="0 0 1300 900">
<rect width="1300" height="900" fill="#12141E"/>
<style>text{font-family:"Segoe UI",Arial,sans-serif;} .ttl{fill:#DCE6FF;font-size:18px;} .sub{fill:#96AAC8;font-size:13px;} .addr{fill:#96DC96;font-size:12px;font-family:monospace;} .lbl{fill:#E6E6E6;font-size:12px;}</style>
<text x="650" y="26" text-anchor="middle" class="ttl">DOS REAL-MODE 1MB MEMORY MAP — HARE.EXE Runtime (verified region boundaries)</text>
<text x="650" y="46" text-anchor="middle" class="sub">Addresses 0x00000–0xFFFFF | Confirmed exact: TDS trailer at 0x0E4A6 matches MZ-header-computed image size to the byte</text>
<rect x="90" y="60" width="220" height="3" fill="#C62828" stroke="#C8C8C8" stroke-width="1"/>
<text x="322" y="65" class="addr">0x00000–0x003FF</text>
<rect x="90" y="60" width="220" height="3" fill="#AD1457" stroke="#C8C8C8" stroke-width="1"/>
<text x="322" y="65" class="addr">0x00400–0x004FF</text>
<rect x="90" y="60" width="220" height="3" fill="#6A1B9A" stroke="#C8C8C8" stroke-width="1"/>
<text x="322" y="65" class="addr">0x00500–0x007FF</text>
<rect x="90" y="61" width="220" height="14" fill="#283593" stroke="#C8C8C8" stroke-width="1"/>
<text x="322" y="72" class="addr">0x00800–0x04FFF</text>
<text x="460" y="65" class="lbl" font-size="10">DOS kernel + COMMAND.COM (~18KB)</text>
