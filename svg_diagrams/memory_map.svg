<rect x="90" y="160" width="220" height="44" fill="#1B5E20" stroke="#C8C8C8" stroke-width="1"/>
<text x="322" y="174" class="addr">0x20000–0x2E4A5</text>
<text x="460" y="186" class="lbl">HARE.EXE code+data image (58.5KB)</text>
